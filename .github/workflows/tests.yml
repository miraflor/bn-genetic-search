name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  released-pgmpy:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Run tests
        run: pytest -q
      - name: Build wheel and source distribution
        if: matrix.python-version == '3.13'
        run: python -m build

  pgmpy-dev:
    # Separate compatibility job: this intentionally tests against pgmpy's
    # moving development API, which is the eventual upstream target.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pgmpy dev and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov "deap>=1.4.4,<2"
          python -m pip install "git+https://github.com/pgmpy/pgmpy.git@dev"
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Run tests against pgmpy dev
        run: pytest -q
